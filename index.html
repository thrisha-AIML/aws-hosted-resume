<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Resume - Thrisha</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            margin-top: 50px;
            background-color: #f4f4f9;
        }
        h1 { color: #333; }
        p { color: #666; font-size: 1.2rem; }
        .card { 
            background: white; 
            padding: 30px; 
            display: inline-block; 
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .counter-box {
            margin-top: 15px;
            padding: 8px 15px;
            background-color: #e2e8f0;
            border-radius: 20px;
            display: inline-block;
            color: #1e293b;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Hi, I'm Thrisha! 👋</h1>
        <p>AIML Student | Aspiring Cloud & DevOps Engineer</p>
        <p>⚡ This site was deployed automatically via GitHub Actions & AWS!</p>
        
        <!-- Visitor Counter Element -->
        <div class="counter-box">
            👀 Profile Views: <span id="counter">Loading...</span>
        </div>
    </div>

    <!-- JavaScript file that fetches the count from AWS Lambda -->
    <script src="script.js"></script>
</body>
</html>
